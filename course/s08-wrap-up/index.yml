# yaml-language-server: $schema=../../schema/course.schema.json
id: s08
title: "Semana 8 · Cierre y resolución de problemas"
shortTitle: "Semana 8"
collapsed: true
description: |
  Esta semana no hay comandos nuevos.
  Cualquier tarea que queramos automatizar, sea un encargo, un ejercicio o una necesidad propia, mezcla diferentes piezas en un contexto que quizá no hemos visto.
  ¿Cómo reconocemos en ella lo que ya sabemos hacer?
  Esta lectura reúne las competencias del curso, propone un método para pasar de un problema a un *script* y recopila los patrones generales con ejemplos en más de un contexto.
  En clase lo pondremos en práctica con un problema integrador.
objectives: |
  - Relacionar cada requisito de un problema con una competencia y un patrón conocido.
  - Empezar cualquier *script* desde un esqueleto que ya maneja opciones y errores.
  - Aplicar los patrones generales a contextos nuevos.
  - Comprobar un *script* antes de entregarlo.
content: class.md
workspace:
  fixtures: fixtures
lessons:
  - id: lecture
    title: "Lectura"
    lessonParts:
      - id: competencies
        title: "Las diez competencias"
        type: lecture
        content: competencies.md

      - id: problem-solving
        title: "Cómo abordar un problema"
        type: lecture
        content: problem-solving.md

      - id: skeleton
        title: "El esqueleto"
        type: lecture
        content: skeleton.md

      - id: patterns
        title: "Patrones generales"
        type: lecture
        content: patterns.md

      - id: checklist
        title: "Antes de darlo por terminado"
        type: lecture
        content: checklist.md

      - id: capstone-problem
        title: "El problema integrador"
        type: lecture
        content: capstone-problem.md

      - id: predict-output
        title: "Predice qué sale"
        type: quiz
        content: predict-output.md
        showTerminal: true

  - id: exercises
    title: "Ejercicios"
    collapsed: true
    description: |
      Ocho *scripts* de repaso, de menos a más difíciles, que reúnen lo de todo el curso, empezando desde el esqueleto.
      Cada uno se comprueba con *Comprobar ejercicio*.
    duration: 240
    content: exercises/intro.md
    lessonParts:
      - id: log-report
        title: "Informe de códigos"
        type: script
        duration: 25
        content: exercises/log-report.md
        showEditor: true
        showTerminal: true
        editors: [informe.sh]
        workspace:                          # workdir: exercises/s08/log-report
          starter: exercises/log-report/starter
        exercise:
          solution: ../../solutions/s08/log-report
          script: informe.sh
          tests: exercises/log-report/tests
          shellcheck: { severity: info, notes: style }
          timeout: 5

      - id: log-summary
        title: "Resumen de varios logs"
        type: script
        duration: 25
        content: exercises/log-summary.md
        showEditor: true
        showTerminal: true
        editors: [resumen.sh]
        workspace:                          # workdir: exercises/s08/log-summary
          starter: exercises/log-summary/starter
        exercise:
